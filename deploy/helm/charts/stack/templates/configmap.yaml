apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "my-llama-stack.fullname" . }}
  labels:
    {{- include "my-llama-stack.labels" . | nindent 4 }}
immutable: false
data:
  INFERENCE_MODEL: "gpt-4o-mini"
  EMBEDDING_MODEL: "sentence-transformers/all-mpnet-base-v2"
  OLLAMA_URL: "http://evolvewired.home.glroland.com:11434"
  MILVUS_ENDPOINT: "http://db.home.glroland.com:19530"
  MILVUS_TOKEN: "root:Milvus"
  LLAMA_STACK_LOGGING: "all=info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://eclipse.home.glroland.com:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_SERVICE_NAME: "my-llama-stack"
  POSTGRES_HOST: "db.home.glroland.com"
  POSTGRES_PORT: "5432"
  POSTGRES_DB_SQL: "llamastack_sql"
  POSTGRES_DB_KV: "llamastack_kv"
  POSTGRES_USER: "llamastack"
  POSTGRES_PASSWORD: "llamastack"
  FILES_STORAGE_DIR: "/llama-storage/files"

  run.yaml: |-
    version: '2'
    image_name: my-llama-stack
    apis:
    - batches
    - file_processors
    - files
    - inference
    - interactions
    - responses
    - safety
    - tool_runtime
    - vector_io
    - datasetio
    - scoring
    providers:
      inference:
      - provider_id: sentence-transformers
        provider_type: inline::sentence-transformers
        config:
          trust_remote_code: false
      - provider_id: transformers
        provider_type: inline::transformers
      - provider_id: lab_evolve
        provider_type: remote::openai
        config:
          base_url: http://evolvewired.home.glroland.com:8080/v1
          api_key: ${env.OPENAI_API_KEY:=nokeyneeded}
      #- provider_id: ${env.VLLM_URL:+vllm}
      #  provider_type: remote::vllm
      #  config:
      #    base_url: ${env.VLLM_URL:=}
      #    max_tokens: ${env.VLLM_MAX_TOKENS:=4096}
      #    api_token: ${env.VLLM_API_TOKEN:=fake}
      #    network:
      #      tls:
      #        verify: ${env.VLLM_TLS_VERIFY:=true}
      - provider_id: openai
        provider_type: remote::openai
        config:
          api_key: ${env.OPENAI_API_KEY:=nokeyneeded}
      - provider_id: anthropic
        provider_type: remote::anthropic
        config:
          api_key: ${env.ANTHROPIC_API_KEY:=nokeyneeded}
      - provider_id: together
        provider_type: remote::together
        config:
          url: https://api.together.xyz/v1
          api_key: ${env.TOGETHER_API_KEY:=null}
      vector_io:
      - provider_id: faiss
        provider_type: inline::faiss
        config:
          db_path: ${env.FAIIS_DB_PATH:=/llama-storage/faiis_local.db}
          persistence:
            namespace: vector_io::faiss
            backend: kv_default
      - provider_id: ${env.MILVUS_URL:+milvus}
        provider_type: inline::milvus
        config:
          db_path: ${env.MILVUS_DB_PATH:=/llama-storage/milvus.db
          persistence:
            namespace: vector_io::milvus
            backend: kv_default
      files:
      - provider_id: builtin-files
        provider_type: inline::localfs
        config:
          storage_dir: ${env.FILES_STORAGE_DIR:=/llama-storage/files}
          metadata_store:
            table_name: files_metadata
            backend: sql_default
      file_processors:
      - provider_id: pypdf
        provider_type: inline::pypdf
      safety:
      - provider_id: llama-guard
        provider_type: inline::llama-guard
        config:
          excluded_categories: []
      - provider_id: code-scanner
        provider_type: inline::code-scanner
      responses:
      - provider_id: builtin
        provider_type: inline::builtin
        config:
          persistence:
            agent_state:
              namespace: agents
              backend: kv_default
            responses:
              table_name: responses
              backend: sql_default
              max_write_queue_size: 10000
              num_writers: 4
      eval:
      - provider_id: builtin
        provider_type: inline::builtin
        config:
          kvstore:
            namespace: eval
            backend: kv_default
      datasetio:
      - provider_id: huggingface
        provider_type: remote::huggingface
        config:
          kvstore:
            namespace: datasetio::huggingface
            backend: kv_default
      - provider_id: localfs
        provider_type: inline::localfs
        config:
          kvstore:
            namespace: datasetio::localfs
            backend: kv_default
      scoring:
      - provider_id: basic
        provider_type: inline::basic
        config: {}
      - provider_id: llm-as-judge
        provider_type: inline::llm-as-judge
        config: {}
      - provider_id: braintrust
        provider_type: inline::braintrust
        config:
          openai_api_key: ${env.OPENAI_API_KEY:=null}
      tool_runtime:
      - provider_id: brave-search
        provider_type: remote::brave-search
        config:
          api_key: ${env.BRAVE_SEARCH_API_KEY:=}
          max_results: 3
      - provider_id: tavily-search
        provider_type: remote::tavily-search
        config:
          api_key: ${env.TAVILY_SEARCH_API_KEY:=}
          max_results: 3
      - provider_id: file-search
        provider_type: inline::file-search
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol
      batches:
      - provider_id: reference
        provider_type: inline::reference
        config:
          kvstore:
            namespace: batches
            backend: kv_default
    logging: null
    server:
      port: {{ .Values.image.port }}
    storage:
      backends:
        kv_default:
          type: kv_sqlite
          db_path: /llama-storage/kv_store.db
        sql_default:
          type: sql_sqlite
          db_path: /llama-storage/sql_store.db

        # Disabled due to bug where responses API history is not being stored
        #
        #kv_default:
        #  type: kv_postgres
        #  host: ${env.POSTGRES_HOST:=localhost}
        #  port: ${env.POSTGRES_PORT:=5432}
        #  db: ${env.POSTGRES_DB_KV:=llamastack_kv}
        #  user: ${env.POSTGRES_USER:=llamastack}
        #  password: ${env.POSTGRES_PASSWORD:=llamastack}
        #  table_name: kv_default
        #sql_default:
        #  type: sql_postgres
        #  host: ${env.POSTGRES_HOST:=localhost}
        #  port: ${env.POSTGRES_PORT:=5432}
        #  db: ${env.POSTGRES_DB_SQL:=llamastack_sql}
        #  user: ${env.POSTGRES_USER:=llamastack}
        #  password: ${env.POSTGRES_PASSWORD:=llamastack}
      stores:
        metadata:
          namespace: registry
          backend: kv_default
        inference:
          table_name: inference_store
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
        conversations:
          table_name: openai_conversations
          backend: sql_default
        prompts:
          namespace: prompts
          backend: kv_default
        connectors:
          namespace: connectors
          backend: kv_default
    registered_resources:
      models:
      - metadata:
          embedding_dimension: 3072
        model_id: text-embedding-3-large
        provider_id: openai
        provider_model_id: text-embedding-3-large
        model_type: embedding
      - metadata:
          embedding_dimension: 768
        model_id: granite-embedding-125m
        provider_id: sentence-transformers
        provider_model_id: ibm-granite/granite-embedding-125m-english
        model_type: embedding
      - metadata:
          embedding_dimension: 768
        model_id: all-mpnet-base-v2
        provider_id: sentence-transformers
        provider_model_id: sentence-transformers/all-mpnet-base-v2
        model_type: embedding
      - metadata:
          embedding_dimension: 256
        model_id: nomic-embed-text-v1.5
        provider_id: sentence-transformers
        provider_model_id: nomic-ai/nomic-embed-text-v1.5
        model_type: embedding
      shields:
      - shield_id: llama-guard
        provider_id: ${env.SAFETY_MODEL:+llama-guard}
        provider_shield_id: ${env.SAFETY_MODEL:=}
      - shield_id: code-scanner
        provider_id: ${env.CODE_SCANNER_MODEL:+code-scanner}
        provider_shield_id: ${env.CODE_SCANNER_MODEL:=}
      vector_dbs: []
      datasets: []
      scoring_fns: []
      benchmarks: []
      tool_groups:
      - toolgroup_id: builtin::websearch
        provider_id: tavily-search
      - toolgroup_id: builtin::rag
        provider_id: rag-runtime
    telemetry:
      enabled: true
    vector_stores:
      default_provider_id: milvus
      default_embedding_model:
        provider_id: sentence-transformers
        model_id: sentence-transformers/all-mpnet-base-v2
      default_reranker_model:
        provider_id: transformers
        model_id: Qwen/Qwen3-Reranker-0.6B
      file_search_params:
        header_template: 'file_search tool found {num_chunks} chunks:

          BEGIN of file_search tool results.

          '
        footer_template: 'END of file_search tool results.

          '
      context_prompt_params:
        chunk_annotation_template: 'Result {index}

          Content: {chunk.content}

          Metadata: {metadata}

          '
        context_template: 'The above results were retrieved to help answer the user''s
          query: "{query}". Use them as supporting information only in answering this
          query. {annotation_instruction}

          '
      annotation_prompt_params:
        enable_annotations: true
        annotation_instruction_template: Cite sources immediately at the end of sentences
          before punctuation, using `<|file-id|>` format like 'This is a fact <|file-Cn3MSNn72ENTiiq11Qda4A|>.'.
          Do not add extra punctuation. Use only the file IDs provided, do not invent
          new ones.
        chunk_annotation_template: '[{index}] {metadata_text} cite as <|{file_id}|>

          {chunk_text}

          '
      file_ingestion_params:
        default_chunk_size_tokens: 512
        default_chunk_overlap_tokens: 128
      chunk_retrieval_params:
        chunk_multiplier: 5
        max_tokens_in_context: 4000
        default_reranker_strategy: rrf
        rrf_impact_factor: 60.0
        weighted_search_alpha: 0.5
        default_search_mode: vector
      file_batch_params:
        max_concurrent_files_per_batch: 3
        file_batch_chunk_size: 10
        cleanup_interval_seconds: 86400
      contextual_retrieval_params:
        default_timeout_seconds: 120
        default_max_concurrency: 3
        max_document_tokens: 100000
    safety:
      default_shield_id: llama-guard
    connectors: []
